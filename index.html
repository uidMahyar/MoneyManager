<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>خزانه — دفتر دخل و خرج شخصی</title>

<!-- Tailwind (نسخه‌ی بدون نیاز به build، مستقیم توی مرورگر کامپایل می‌شه) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- فایل CSS جدا -->
<link rel="stylesheet" href="style.css" />

<!-- نگاشت پکیج‌ها به نسخه‌ی ماژول مرورگری‌شون -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>

<!-- Babel Standalone: چون app.jsx داخلش از سینتکس JSX استفاده می‌کنه
     (مثل <div>...</div> وسط جاوااسکریپت)، مرورگر به‌تنهایی نمی‌تونه
     بخونتش. Babel همون لحظه‌ی اجرا JSX رو به جاوااسکریپت خالص تبدیل
     می‌کنه، بدون نیاز به مرحله‌ی build جدا. -->
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- فایل JS/JSX جدا -->
<script type="text/babel" data-type="module" data-presets="react" src="app.jsx"></script>
</body>
</html>
