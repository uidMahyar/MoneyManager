<script type="text/babel" data-type="module" data-presets="react">
// -------------------------------------------------------------------
// این فایل نسخه‌ی مستقل (standalone) اپ «خزانه» است — یک فایل تنها،
// بدون نیاز به نصب یا build، فقط با اتصال اینترنت اولیه برای بارگذاری
// کتابخونه‌ها از CDN باز می‌شه. داده‌ها با localStorage مرورگر خودت
// ذخیره می‌شن، یعنی فقط روی همین مرورگر و همین دستگاه باقی می‌مونن.
// -------------------------------------------------------------------

import React, { useState, useEffect, useMemo } from 'react';
import ReactDOM from 'react-dom/client';
import {
  Wallet, X, Trash2, TrendingUp, TrendingDown, Utensils, Car, ShoppingBag,
  Receipt, Gamepad2, HeartPulse, GraduationCap, MoreHorizontal, Briefcase,
  Store, Gift, PiggyBank, Sparkles, Download, Pencil,
} from 'lucide-react';
import * as XLSX from 'xlsx';

// جایگزین ذخیره‌سازی: به‌جای window.storage مخصوص محیط آرتیفکت،
// از localStorage واقعی مرورگر استفاده می‌کنیم (با همون امضای تابع،
// تا بقیه‌ی کد بدون تغییر کار کنه). اگه localStorage در دسترس نبود
// (مثلاً حالت خصوصی خیلی محدود)، بی‌صدا به حافظه‌ی موقت برمی‌گرده.
const memoryFallback = {};
window.storage = {
  async get(key) {
    try {
      const raw = localStorage.getItem('khazaneh:' + key);
      if (raw !== null) return { key, value: raw };
      if (key in memoryFallback) return { key, value: memoryFallback[key] };
      return null;
    } catch (e) {
      return key in memoryFallback ? { key, value: memoryFallback[key] } : null;
    }
  },
  async set(key, value) {
    memoryFallback[key] = value;
    try {
      localStorage.setItem('khazaneh:' + key, value);
      return { key, value };
    } catch (e) {
      console.warn('localStorage در دسترس نبود، فقط توی حافظه‌ی موقت ذخیره شد', e);
      return { key, value };
    }
  },
};


// ---------- category tokens (muted ledger palette) ----------
const EXPENSE_CATEGORIES = [
  { id: 'food', label: 'خوراک و رستوران', icon: Utensils, color: '#c17a52' },
  { id: 'transport', label: 'حمل و نقل', icon: Car, color: '#5478a0' },
  { id: 'shopping', label: 'خرید', icon: ShoppingBag, color: '#a8677a' },
  { id: 'bills', label: 'قبض و اجاره', icon: Receipt, color: '#c19a56' },
  { id: 'fun', label: 'سرگرمی', icon: Gamepad2, color: '#8a7ca8' },
  { id: 'health', label: 'سلامت', icon: HeartPulse, color: '#b25b4a' },
  { id: 'edu', label: 'آموزش', icon: GraduationCap, color: '#4f8a82' },
  { id: 'other_exp', label: 'سایر', icon: MoreHorizontal, color: '#8c8272' },
];

const INCOME_CATEGORIES = [
  { id: 'salary', label: 'حقوق', icon: Briefcase, color: '#5e9070' },
  { id: 'sales', label: 'فروش', icon: Store, color: '#4f8a82' },
  { id: 'gift', label: 'هدیه', icon: Gift, color: '#a8677a' },
  { id: 'invest', label: 'سرمایه‌گذاری', icon: TrendingUp, color: '#c19a56' },
  { id: 'other_inc', label: 'سایر', icon: MoreHorizontal, color: '#8c8272' },
];

const BRASS = '#c19a56';   // cash
const INKBLUE = '#5478a0'; // bank
const JADE = '#5e9070';    // income
const RUST = '#b25b4a';    // expense

function getCategoryInfo(type, id) {
  const list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  return list.find((c) => c.id === id) || list[list.length - 1];
}

function formatMoney(amount) {
  return Math.round(amount).toLocaleString('en-US');
}

function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(dateStr) {
  return new Intl.DateTimeFormat('fa-IR', { day: 'numeric', month: 'long' }).format(
    parseLocalDate(dateStr)
  );
}

function todayISO() {
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().split('T')[0];
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}


// دقیقاً همون ظاهر نمودار حلقه‌ای قبلی، اما بدون وابستگی به recharts —
// چون این فایل قراره مستقل و آفلاین‌مانند (فقط با اتصال اولیه) کار کنه.
function RingChart({ data, innerRadiusPct = 0.6, outerRadiusPct = 0.95, paddingAngleDeg = 0, size = 100 }) {
  const cx = size / 2;
  const cy = size / 2;
  const maxR = size / 2;
  const outerR = outerRadiusPct * maxR;
  const innerR = innerRadiusPct * maxR;
  const ringR = (outerR + innerR) / 2;
  const strokeWidth = outerR - innerR;
  const circumference = 2 * Math.PI * ringR;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const gapLen = data.length > 1 ? (paddingAngleDeg / 360) * circumference : 0;
  let offsetAcc = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" height="100%">
      <g transform={`rotate(-90 ${cx} ${cy})`}>
        {data.map((d, i) => {
          const rawLen = (d.value / total) * circumference;
          const segLen = Math.max(0, rawLen - gapLen);
          const dashOffset = -offsetAcc;
          offsetAcc += rawLen;
          return (
            <circle
              key={i}
              cx={cx}
              cy={cy}
              r={ringR}
              fill="none"
              stroke={d.color}
              strokeWidth={strokeWidth}
              strokeDasharray={`${segLen} ${circumference - segLen}`}
              strokeDashoffset={dashOffset}
            />
          );
        })}
      </g>
    </svg>
  );
}

function Khazaneh() {
  const [transactions, setTransactions] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [filterType, setFilterType] = useState('all');
  const [filterMethod, setFilterMethod] = useState('all');
  const [deleteTargetId, setDeleteTargetId] = useState(null);

  const [formType, setFormType] = useState('expense');
  const [formAmount, setFormAmount] = useState('');
  const [formMethod, setFormMethod] = useState('cash');
  const [formCategory, setFormCategory] = useState(EXPENSE_CATEGORIES[0].id);
  const [formNote, setFormNote] = useState('');
  const [formDate, setFormDate] = useState(todayISO());

  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get('transactions', false);
        if (result && result.value) setTransactions(JSON.parse(result.value));
      } catch (e) {
        // no data yet — first run
      } finally {
        setIsLoading(false);
      }
    })();
  }, []);

  useEffect(() => {
    if (isLoading) return;
    (async () => {
      try {
        await window.storage.set('transactions', JSON.stringify(transactions), false);
      } catch (e) {
        console.error('save failed', e);
      }
    })();
  }, [transactions, isLoading]);

  const totals = useMemo(() => {
    let cash = 0, bank = 0, monthIncome = 0, monthExpense = 0;
    const now = new Date();
    transactions.forEach((t) => {
      const sign = t.type === 'income' ? 1 : -1;
      if (t.method === 'cash') cash += sign * t.amount;
      else bank += sign * t.amount;
      const d = parseLocalDate(t.date);
      if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
        if (t.type === 'income') monthIncome += t.amount;
        else monthExpense += t.amount;
      }
    });
    return { cash, bank, total: cash + bank, monthIncome, monthExpense };
  }, [transactions]);

  const dialData = useMemo(() => {
    const cashPos = Math.max(0, totals.cash);
    const bankPos = Math.max(0, totals.bank);
    if (cashPos + bankPos === 0) return [{ name: 'خالی', value: 1, color: '#2a251e' }];
    return [
      { name: 'نقدی', value: cashPos, color: BRASS },
      { name: 'بانکی', value: bankPos, color: INKBLUE },
    ].filter((d) => d.value > 0);
  }, [totals]);

  const categoryBreakdown = useMemo(() => {
    const now = new Date();
    const map = {};
    transactions
      .filter((t) => t.type === 'expense')
      .filter((t) => {
        const d = parseLocalDate(t.date);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      })
      .forEach((t) => { map[t.category] = (map[t.category] || 0) + t.amount; });
    return Object.entries(map)
      .map(([id, value]) => {
        const info = getCategoryInfo('expense', id);
        return { name: info.label, value, color: info.color };
      })
      .sort((a, b) => b.value - a.value);
  }, [transactions]);

  const filteredTransactions = useMemo(() => {
    return transactions
      .filter((t) => filterType === 'all' || t.type === filterType)
      .filter((t) => filterMethod === 'all' || t.method === filterMethod)
      .sort((a, b) => parseLocalDate(b.date) - parseLocalDate(a.date) || b.createdAt - a.createdAt);
  }, [transactions, filterType, filterMethod]);

  function openAddModal(type) {
    setEditingId(null);
    setFormType(type);
    setFormAmount('');
    setFormMethod('cash');
    setFormCategory(type === 'income' ? INCOME_CATEGORIES[0].id : EXPENSE_CATEGORIES[0].id);
    setFormNote('');
    setFormDate(todayISO());
    setShowModal(true);
  }

  function openEditModal(t) {
    setEditingId(t.id);
    setFormType(t.type);
    setFormAmount(String(t.amount));
    setFormMethod(t.method);
    setFormCategory(t.category);
    setFormNote(t.note || '');
    setFormDate(t.date);
    setShowModal(true);
  }

  function handleSubmit() {
    const amount = parseFloat(formAmount);
    if (!amount || amount <= 0) return;
    if (editingId) {
      setTransactions((prev) =>
        prev.map((t) =>
          t.id === editingId
            ? { ...t, type: formType, amount, method: formMethod, category: formCategory, note: formNote.trim(), date: formDate }
            : t
        )
      );
    } else {
      setTransactions((prev) => [
        { id: makeId(), createdAt: Date.now(), type: formType, amount, method: formMethod, category: formCategory, note: formNote.trim(), date: formDate },
        ...prev,
      ]);
    }
    setShowModal(false);
  }

  function handleDelete(id) {
    setDeleteTargetId(id);
  }

  function confirmDelete() {
    setTransactions((prev) => prev.filter((t) => t.id !== deleteTargetId));
    setDeleteTargetId(null);
  }

  function cancelDelete() {
    setDeleteTargetId(null);
  }

  function exportToExcel() {
    const data = transactions
      .slice()
      .sort((a, b) => parseLocalDate(b.date) - parseLocalDate(a.date))
      .map((t) => ({
        'تاریخ': formatDate(t.date),
        'نوع': t.type === 'income' ? 'درآمد' : 'هزینه',
        'مبلغ (تومان)': t.amount,
        'روش': t.method === 'cash' ? 'نقدی' : 'بانکی',
        'دسته‌بندی': getCategoryInfo(t.type, t.category).label,
        'توضیحات': t.note || '',
      }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تراکنش‌ها');
    XLSX.writeFile(wb, 'khazaneh-export.xlsx');
  }

  const inject = `
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
    :root {
      --bg:#14100c; --ink:#f0e9dc; --ink-muted:#8c8272;
      --brass:${BRASS}; --inkblue:${INKBLUE}; --jade:${JADE}; --rust:${RUST};
    }
    .kz-root { font-family:'Vazirmatn',Tahoma,sans-serif; background-color:var(--bg); color:var(--ink); }
    .kz-mono { font-family:'JetBrains Mono','Courier New',monospace; font-variant-numeric:tabular-nums; }
    .kz-muted { color:var(--ink-muted); }
    .kz-ledger-lines { background-image: repeating-linear-gradient(to bottom, transparent, transparent 31px, rgba(240,233,220,0.025) 32px); }
    .kz-text-brass{color:var(--brass)} .kz-text-inkblue{color:var(--inkblue)} .kz-text-jade{color:var(--jade)} .kz-text-rust{color:var(--rust)}
    .kz-bg-brass{background-color:var(--brass)} .kz-bg-jade{background-color:var(--jade)} .kz-bg-rust{background-color:var(--rust)}
    .kz-tint-brass{background-color:rgba(193,154,86,0.14)} .kz-tint-inkblue{background-color:rgba(84,120,160,0.14)}
    .kz-tint-jade{background-color:rgba(94,144,112,0.16)} .kz-tint-rust{background-color:rgba(178,91,74,0.16)}
    .kz-border-brass{border-color:rgba(193,154,86,0.4)} .kz-border-inkblue{border-color:rgba(84,120,160,0.4)}
    .kz-surface{background-color:rgba(240,233,220,0.04)} .kz-surface-2{background-color:rgba(240,233,220,0.07)}
    .kz-hairline{border-color:rgba(240,233,220,0.1)} .kz-divide > * + *{border-top:1px solid rgba(240,233,220,0.08)}
    @keyframes kz-slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .kz-animate-slideup{animation:kz-slideup .28s cubic-bezier(.32,.72,0,1)}
    .kz-noscroll::-webkit-scrollbar{display:none} .kz-noscroll{-ms-overflow-style:none;scrollbar-width:none}
    .kz-root input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.85);opacity:.7;cursor:pointer}
    .kz-root button:focus-visible, .kz-root input:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }
    @media (prefers-reduced-motion: reduce) {
      .kz-animate-slideup { animation: none; }
      .kz-root * { transition-duration: 0.01ms !important; }
    }
  `;

  if (isLoading) {
    return (
      <div dir="rtl" className="kz-root min-h-screen flex items-center justify-center">
        <style>{inject}</style>
        <div className="flex flex-col items-center gap-3">
          <div className="w-8 h-8 border-2 rounded-full animate-spin" style={{ borderColor: 'var(--brass)', borderTopColor: 'transparent' }} />
          <p className="kz-muted text-sm">در حال بارگذاری...</p>
        </div>
      </div>
    );
  }

  return (
    <div dir="rtl" className="kz-root kz-ledger-lines min-h-screen relative">
      <style>{inject}</style>

      <div className="max-w-lg mx-auto px-4 pt-6 pb-28">
        {/* header */}
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-xl font-bold flex items-center gap-2">
              <span className="w-8 h-8 rounded-lg flex items-center justify-center kz-bg-brass">
                <Wallet size={16} color="#14100c" />
              </span>
              خزانه
            </h1>
            <p className="kz-muted text-xs mt-1" style={{ marginRight: '2.5rem' }}>دفتر دخل و خرج شخصی</p>
          </div>
          <button
            onClick={exportToExcel}
            disabled={transactions.length === 0}
            className="w-9 h-9 rounded-lg border kz-hairline flex items-center justify-center kz-muted active:scale-95 transition disabled:opacity-30 disabled:pointer-events-none shrink-0"
          >
            <Download size={15} />
          </button>
        </div>

        {/* signature: balance dial */}
        <div className="rounded-2xl border kz-hairline kz-surface p-6 mb-4">
          <div className="relative mx-auto w-52 h-52">
            <RingChart data={dialData} innerRadiusPct={0.72} outerRadiusPct={0.94} paddingAngleDeg={dialData.length > 1 ? 3 : 0} size={208} />
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-4">
              <p className="kz-muted text-xs mb-1">موجودی کل</p>
              <p className={`kz-mono text-3xl font-bold text-center ${totals.total < 0 ? 'kz-text-rust' : ''}`}>
                {formatMoney(totals.total)}
              </p>
              <p className="kz-muted text-xs mt-1">تومان</p>
            </div>
          </div>

          <div className="flex justify-center gap-6 mt-5">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full kz-bg-brass" />
              <span className="text-xs kz-muted">نقدی</span>
              <span className="kz-mono text-sm font-semibold">{formatMoney(totals.cash)}</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: INKBLUE }} />
              <span className="text-xs kz-muted">بانکی</span>
              <span className="kz-mono text-sm font-semibold">{formatMoney(totals.bank)}</span>
            </div>
          </div>
        </div>

        {/* this month, ledger-style row */}
        <div className="rounded-2xl border kz-hairline kz-surface p-4 mb-4 flex items-stretch">
          <div className="flex-1 text-center">
            <p className="text-xs kz-muted mb-1">درآمد این ماه</p>
            <p className="kz-mono text-lg font-bold kz-text-jade">{formatMoney(totals.monthIncome)}</p>
          </div>
          <div className="w-px" style={{ backgroundColor: 'rgba(240,233,220,0.1)' }} />
          <div className="flex-1 text-center">
            <p className="text-xs kz-muted mb-1">هزینه این ماه</p>
            <p className="kz-mono text-lg font-bold kz-text-rust">{formatMoney(totals.monthExpense)}</p>
          </div>
        </div>

        {/* category breakdown — quiet echo of the dial motif */}
        {categoryBreakdown.length > 0 && (
          <div className="rounded-2xl border kz-hairline kz-surface p-4 mb-4">
            <p className="text-sm font-semibold mb-3 flex items-center gap-1.5">
              <Sparkles size={13} className="kz-muted" />
              پراکندگی هزینه‌ها این ماه
            </p>
            <div className="flex items-center gap-4">
              <div className="w-20 h-20 shrink-0">
                <RingChart data={categoryBreakdown} innerRadiusPct={0.6} outerRadiusPct={0.95} paddingAngleDeg={2} size={80} />
              </div>
              <div className="flex-1 space-y-1.5 min-w-0">
                {categoryBreakdown.slice(0, 4).map((c, i) => (
                  <div key={i} className="flex items-center justify-between gap-2 text-xs">
                    <div className="flex items-center gap-1.5 min-w-0">
                      <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: c.color }} />
                      <span className="kz-muted truncate">{c.name}</span>
                    </div>
                    <span className="kz-mono shrink-0">{formatMoney(c.value)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* filters */}
        <div className="flex gap-2 mb-4 overflow-x-auto kz-noscroll">
          {[{ k: 'all', l: 'همه' }, { k: 'income', l: 'درآمد' }, { k: 'expense', l: 'هزینه' }].map((f) => (
            <button
              key={f.k}
              onClick={() => setFilterType(f.k)}
              className="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition"
              style={filterType === f.k
                ? { backgroundColor: 'var(--ink)', color: 'var(--bg)', borderColor: 'var(--ink)' }
                : { color: 'var(--ink-muted)', borderColor: 'rgba(240,233,220,0.1)' }}
            >
              {f.l}
            </button>
          ))}
          <span className="w-px my-1" style={{ backgroundColor: 'rgba(240,233,220,0.1)' }} />
          {[{ k: 'all', l: 'همه روش‌ها' }, { k: 'cash', l: 'نقدی' }, { k: 'bank', l: 'بانکی' }].map((f) => (
            <button
              key={f.k}
              onClick={() => setFilterMethod(f.k)}
              className="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition"
              style={filterMethod === f.k
                ? { backgroundColor: 'var(--ink)', color: 'var(--bg)', borderColor: 'var(--ink)' }
                : { color: 'var(--ink-muted)', borderColor: 'rgba(240,233,220,0.1)' }}
            >
              {f.l}
            </button>
          ))}
        </div>

        {/* ledger — transaction rows with hairline dividers, not card soup */}
        {filteredTransactions.length === 0 ? (
          <div className="text-center py-12">
            <div className="w-14 h-14 rounded-2xl kz-surface flex items-center justify-center mx-auto mb-3">
              <PiggyBank size={22} className="kz-muted" />
            </div>
            <p className="kz-muted text-sm">هنوز تراکنشی ثبت نشده</p>
            <p className="text-xs mt-1" style={{ color: 'rgba(140,130,114,0.7)' }}>با دکمه‌های پایین صفحه اولین تراکنش‌تو اضافه کن</p>
          </div>
        ) : (
          <div className="rounded-2xl border kz-hairline kz-surface kz-divide overflow-hidden">
            {filteredTransactions.map((t) => {
              const info = getCategoryInfo(t.type, t.category);
              const Icon = info.icon;
              return (
                <div key={t.id} className="flex items-center gap-3 p-3 active:brightness-110 transition" onClick={() => openEditModal(t)}>
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: `${info.color}22` }}>
                    <Icon size={17} style={{ color: info.color }} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium truncate">{info.label}</p>
                    <div className="flex items-center gap-1.5 text-xs kz-muted mt-0.5">
                      <span>{formatDate(t.date)}</span>
                      <span>·</span>
                      <span style={{ color: t.method === 'cash' ? BRASS : INKBLUE }}>
                        {t.method === 'cash' ? 'نقدی' : 'بانکی'}
                      </span>
                      {t.note ? <><span>·</span><span className="truncate">{t.note}</span></> : null}
                    </div>
                  </div>
                  <p className={`kz-mono text-sm font-bold shrink-0 ${t.type === 'income' ? 'kz-text-jade' : 'kz-text-rust'}`}>
                    {t.type === 'income' ? '+' : '−'}{formatMoney(t.amount)}
                  </p>
                  <button
                    onClick={(e) => { e.stopPropagation(); handleDelete(t.id); }}
                    className="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center kz-muted transition"
                  >
                    <Trash2 size={14} />
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* bottom action bar */}
      <div className="fixed bottom-0 left-0 right-0 pb-6 pt-3 px-4" style={{ background: 'linear-gradient(to top, var(--bg) 55%, transparent)' }}>
        <div className="max-w-lg mx-auto flex gap-3">
          <button
            onClick={() => openAddModal('expense')}
            className="flex-1 py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition"
            style={{ backgroundColor: RUST, color: '#f0e9dc' }}
          >
            <TrendingDown size={17} /> هزینه
          </button>
          <button
            onClick={() => openAddModal('income')}
            className="flex-1 py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition"
            style={{ backgroundColor: JADE, color: '#f0e9dc' }}
          >
            <TrendingUp size={17} /> درآمد
          </button>
        </div>
      </div>

      {/* add / edit sheet */}
      {showModal && (
        <div className="fixed inset-0 z-50 flex items-end justify-center">
          <div className="absolute inset-0" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }} onClick={() => setShowModal(false)} />
          <div className="kz-root kz-animate-slideup relative w-full max-w-lg rounded-t-3xl border-t p-5 pb-8 max-h-screen overflow-y-auto" style={{ backgroundColor: '#1b160f', borderColor: 'rgba(240,233,220,0.1)' }}>
            <div className="w-10 h-1 rounded-full mx-auto mb-5" style={{ backgroundColor: 'rgba(240,233,220,0.15)' }} />

            <div className="flex items-center justify-between mb-5">
              <h2 className="text-lg font-bold flex items-center gap-2">
                {editingId ? <Pencil size={16} className="kz-muted" /> : null}
                {editingId ? 'ویرایش تراکنش' : formType === 'income' ? 'ثبت درآمد جدید' : 'ثبت هزینه جدید'}
              </h2>
              <button onClick={() => setShowModal(false)} className="w-8 h-8 rounded-full kz-surface flex items-center justify-center">
                <X size={16} />
              </button>
            </div>

            <div className="flex gap-2 mb-5 p-1 rounded-2xl kz-surface">
              <button
                onClick={() => { setFormType('expense'); setFormCategory(EXPENSE_CATEGORIES[0].id); }}
                className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition ${formType === 'expense' ? 'kz-tint-rust kz-text-rust' : 'kz-muted'}`}
              >
                هزینه
              </button>
              <button
                onClick={() => { setFormType('income'); setFormCategory(INCOME_CATEGORIES[0].id); }}
                className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition ${formType === 'income' ? 'kz-tint-jade kz-text-jade' : 'kz-muted'}`}
              >
                درآمد
              </button>
            </div>

            <div className="mb-4">
              <label className="text-xs kz-muted mb-2 block">مبلغ (تومان)</label>
              <input
                type="number"
                inputMode="numeric"
                value={formAmount}
                onChange={(e) => setFormAmount(e.target.value)}
                placeholder="0"
                dir="ltr"
                className="kz-mono w-full kz-surface border kz-hairline rounded-2xl px-4 py-3.5 text-2xl font-bold outline-none transition"
                style={{ color: 'var(--ink)' }}
              />
            </div>

            <div className="mb-4">
              <label className="text-xs kz-muted mb-2 block">روش پرداخت</label>
              <div className="flex gap-2">
                <button
                  onClick={() => setFormMethod('cash')}
                  className={`flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5 border transition ${formMethod === 'cash' ? 'kz-tint-brass kz-border-brass kz-text-brass' : 'kz-muted kz-hairline'}`}
                >
                  نقدی
                </button>
                <button
                  onClick={() => setFormMethod('bank')}
                  className={`flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5 border transition ${formMethod === 'bank' ? 'kz-tint-inkblue kz-border-inkblue kz-text-inkblue' : 'kz-muted kz-hairline'}`}
                >
                  بانکی
                </button>
              </div>
            </div>

            <div className="mb-4">
              <label className="text-xs kz-muted mb-2 block">دسته‌بندی</label>
              <div className="grid grid-cols-4 gap-2">
                {(formType === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map((cat) => {
                  const Icon = cat.icon;
                  const active = formCategory === cat.id;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => setFormCategory(cat.id)}
                      className="flex flex-col items-center gap-1 py-2.5 rounded-xl border transition"
                      style={active ? { borderColor: `${cat.color}66`, backgroundColor: `${cat.color}18` } : { borderColor: 'rgba(240,233,220,0.08)' }}
                    >
                      <Icon size={16} style={{ color: active ? cat.color : 'var(--ink-muted)' }} />
                      <span className="text-xs leading-tight text-center" style={{ color: active ? 'var(--ink)' : 'var(--ink-muted)' }}>
                        {cat.label}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mb-4">
              <label className="text-xs kz-muted mb-2 block">توضیحات (اختیاری)</label>
              <input
                type="text"
                value={formNote}
                onChange={(e) => setFormNote(e.target.value)}
                placeholder="مثلاً: ناهار با دوستان"
                className="w-full kz-surface border kz-hairline rounded-2xl px-4 py-3 text-sm outline-none transition"
                style={{ color: 'var(--ink)' }}
              />
            </div>

            <div className="mb-6">
              <label className="text-xs kz-muted mb-2 block">تاریخ</label>
              <input
                type="date"
                value={formDate}
                onChange={(e) => setFormDate(e.target.value)}
                style={{ colorScheme: 'dark', color: 'var(--ink)' }}
                className="w-full kz-surface border kz-hairline rounded-2xl px-4 py-3 text-sm outline-none transition"
              />
            </div>

            <button
              onClick={handleSubmit}
              disabled={!formAmount || parseFloat(formAmount) <= 0}
              className="w-full py-4 rounded-2xl font-bold text-sm transition active:scale-95 disabled:opacity-30 disabled:pointer-events-none"
              style={{ backgroundColor: formType === 'income' ? JADE : RUST, color: '#f0e9dc' }}
            >
              {editingId ? 'ذخیره تغییرات' : `ثبت ${formType === 'income' ? 'درآمد' : 'هزینه'}`}
            </button>
          </div>
        </div>
      )}

      {/* delete confirmation — custom UI instead of window.confirm, which browsers
          may block or auto-resolve inside a sandboxed artifact iframe */}
      {deleteTargetId && (() => {
        const target = transactions.find((t) => t.id === deleteTargetId);
        if (!target) return null;
        const info = getCategoryInfo(target.type, target.category);
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="absolute inset-0" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }} onClick={cancelDelete} />
            <div className="kz-root kz-animate-slideup relative w-full max-w-sm rounded-2xl border p-5" style={{ backgroundColor: '#1b160f', borderColor: 'rgba(240,233,220,0.1)' }}>
              <p className="text-sm font-bold mb-1">این تراکنش حذف بشه؟</p>
              <p className="text-xs kz-muted mb-5">
                {info.label} · {target.type === 'income' ? '+' : '−'}{formatMoney(target.amount)} تومان
                {target.note ? ` · ${target.note}` : ''}
              </p>
              <div className="flex gap-2">
                <button
                  onClick={cancelDelete}
                  className="flex-1 py-3 rounded-xl text-sm font-semibold kz-surface kz-muted active:scale-95 transition"
                >
                  انصراف
                </button>
                <button
                  onClick={confirmDelete}
                  className="flex-1 py-3 rounded-xl text-sm font-bold active:scale-95 transition"
                  style={{ backgroundColor: RUST, color: '#f0e9dc' }}
                >
                  حذف کن
                </button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<Khazaneh />);
</script>
</body>
</html>
